cosmetics:
  particle_interval_ticks: 20
  trail_interval_ticks: 5
  pet_follow_distance: 3.0
  default_particle: FLAME
  default_trail: CRIT
  default_pet: CAT
  # Names must match the Particle enum of the running server — they get renamed
  # between Minecraft versions, and anything that no longer resolves is dropped
  # with a warning at startup. Particles needing a data payload (DUST and
  # friends) are rejected too: the cosmetic system has no way to supply one.
  available_particles:
    - FLAME
    - HEART
    - ENCHANT
    - HAPPY_VILLAGER
    - TOTEM_OF_UNDYING
  available_trails:
    - CRIT
    - ENCHANTED_HIT
    - END_ROD
    - NOTE
  available_pets:
    - WOLF
    - CAT
