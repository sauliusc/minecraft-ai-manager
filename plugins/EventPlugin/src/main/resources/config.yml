boss_raid:
  # The arena is deliberately not set by default. A Wither breaks terrain, so a
  # guessed location craters whatever is there — the old default was 0, 64, 0,
  # which is world spawn (#335). Set this to open ground well away from spawn
  # and from anything players have built; the raid refuses to start until you do.
  #arena:
  #  world: world
  #  x: 2000.0
  #  y: 90.0
  #  z: 2000.0
  rewards:
    first_place_id: boss_raid_first
    second_place_id: boss_raid_second
    third_place_id: boss_raid_third
    participation_id: boss_raid_participant

build_battle:
  world: world
  build_time_minutes: 20
  plots:
    - x: 200.0
      y: 64.0
      z: 0.0
      radius: 10
    - x: 200.0
      y: 64.0
      z: 50.0
      radius: 10
    - x: 200.0
      y: 64.0
      z: 100.0
      radius: 10
    - x: 200.0
      y: 64.0
      z: 150.0
      radius: 10
  kit:
    - material: OAK_PLANKS
      amount: 64
    - material: STONE
      amount: 64
    - material: GLASS
      amount: 32
    - material: OAK_LOG
      amount: 32
    - material: DIRT
      amount: 64
    - material: CRAFTING_TABLE
      amount: 1
    - material: WOODEN_PICKAXE
      amount: 1
    - material: WOODEN_AXE
      amount: 1
    - material: WOODEN_SHOVEL
      amount: 1
  rewards:
    first_place_id: build_battle_first
    second_place_id: build_battle_second
    third_place_id: build_battle_third

treasure_hunt:
  chests:
    - world: world
      x: 100
      y: 64
      z: 100
    - world: world
      x: -100
      y: 64
      z: 200
    - world: world
      x: 50
      y: 64
      z: -150
  rewards:
    finder_id: treasure_finder
    completion_id: treasure_completion
