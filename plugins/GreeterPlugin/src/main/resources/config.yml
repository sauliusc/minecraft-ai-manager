greeting:
  first_join_message: "Welcome, {player}!"
  return_message: "Welcome back, {player}! Last seen {lastSeen}."
  return_gift_after_days: 7
  broadcast_first_join: true
  broadcast_message: "{player} joined for the first time!"

# Where arriving players are placed. Commented out by default so a fresh
# install uses the world spawn, which is somewhere a player can actually stand.
#
# y=64 is underground on most terrain — it was the old default here, and it put
# every arriving player inside solid stone (#366). Set x/z and leave y out to
# land on the surface at those coordinates; the teleport is skipped entirely if
# the destination turns out to be inside a block.
#welcome_zone:
#  world: "world"
#  x: 0.5
#  z: 0.5

resource_pack:
  enabled: false
  url: ""
  sha1: ""
  required: false
  prompt: "Download the CraftControl resource pack for the best experience!"

starter_kit:
  enabled: true
  items:
    - material: STONE_SWORD
      amount: 1
    - material: BREAD
      amount: 16
    - material: TORCH
      amount: 32
