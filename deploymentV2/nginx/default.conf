server {
    listen       80;
    server_name  _;

    # Use Docker's embedded DNS so upstream hostnames resolve at request time
    # rather than at nginx startup (prevents "host not found in upstream" on boot).
    resolver 127.0.0.11 valid=30s;

    # React SPA root
    root  /usr/share/nginx/html;
    index index.html;

    # ── AI generation endpoints — longer timeout for LLM calls ──────────
    # Must come before /api/ (nginx picks the longest matching prefix
    # regardless of file order, but keeping it visually first avoids
    # surprises). The 30s default below is too short for LLM generation.
    location ^~ /api/ai/ {
        set $api_backend api:3000;
        proxy_pass         http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    # ── API reverse proxy ──────────────────────────────────────────────
    location ^~ /api/ {
        set $api_backend api:3000;
        proxy_pass         http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Upload size for chat-log batch inserts
        client_max_body_size 2m;
    }

    # ── Probe paths — answer honestly instead of handing back the SPA ──
    # try_files below falls back to index.html for ANY unmatched path, so
    # scanners probing /.env, /.git/config or /wp-login.php all got a 200 with
    # the app shell. Nothing leaks — the files are not there — but a 200 reads
    # as "found" to a scanner and escalates the probing, and it hides genuine
    # 404s from the access log, so a broken asset path looks like a success.
    location ~ /\. {
        access_log off;
        return 404;
    }

    # Anything with an extension is a file request, not an app route. If it did
    # not match a real file it does not exist, so say so rather than returning
    # HTML with a .php or .env content type.
    location ~* \.(php|asp|aspx|jsp|cgi|sh|sql|bak|old|env|ini|yml|yaml|conf)$ {
        access_log off;
        return 404;
    }

    # ── React client-side routing (must come after /api/) ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ───────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "same-origin" always;

    # ── Gzip ────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
