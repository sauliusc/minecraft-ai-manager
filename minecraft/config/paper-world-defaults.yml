# Paper per-world defaults — performance tuning
# Baked into the image at build time (see minecraft/Dockerfile) and copied to
# /data/config/paper-world-defaults.yml by itzg's entrypoint on every start.
# Only override keys that differ from Paper's built-in defaults; Paper merges
# the rest. See https://docs.papermc.io/paper/reference/world-configuration
_version: 30

tick-rates:
  behavior:
    villager:
      # Paper default: -1 (run every tick). With a trading hall or large
      # village the O(n²) entity-push loop causes the server thread to stall
      # for 15-20 s. Raising these to 60/120 ticks (3s / 6s) cuts per-tick
      # villager CPU by ~97% with no noticeable gameplay impact.
      validatenearbypoi: 60
      acquirepoi: 120

collisions:
  # Cap how many collisions each entity resolves per tick (0 = resolve none).
  # This bounds the push *work*, but NOT the lookup: live thread dumps on
  # 2026-08-20 show LivingEntity.pushEntities() still calling
  # getPushableEntities(), so the O(n) entity scan runs regardless of this
  # value. It is therefore a mitigation, never a fix for an entity pile-up —
  # the only real fix is to keep the entity count down (see #295, where
  # NpcPlugin had stacked 5000+ villagers into two chunks).
  #
  # NOTE: this key is top-level `collisions:`, NOT nested under `entities:`.
  # An earlier version of this file had it under `entities: collision:`,
  # which isn't a real Paper config path — Paper silently ignored it and
  # the hang was never actually fixed. See minecraft-ai-manager#281.
  max-entity-collisions: 0

entities:
  spawning:
    entity-per-chunk-save-limit:
      # Prevent runaway villager accumulation in trading halls / breeders.
      # Paper default is -1 (unlimited). 20 per chunk is generous for normal play.
      villager: 20
      # Keep projectile spam from bloating saves.
      arrow: 16
      snowball: 8
      egg: 8
      ender_pearl: 8
      fireball: 8
      small_fireball: 8
      experience_orb: 16
