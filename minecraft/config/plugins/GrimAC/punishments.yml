# GrimAC punishments — CraftControl's version.
#
# Shipped in the image rather than left to Grim's default, because the default is
# regenerated on a fresh volume and the ccflag lines below would be lost
# silently — the same failure #336 fixed for plugin JARs.
#
# Two deliberate choices:
#
#   * No kicks and no bans. These are six ~13-year-old friends on a private
#     server, where a false positive that kicks somebody mid-game is worse than
#     a missed cheat. Alerts and dashboard records only, until the flags we
#     actually see justify more.
#
#   * ccflag runs at the same threshold as [alert]. What is worth telling staff
#     about in game is exactly what is worth showing in CraftControl, and
#     recording every violation instead would bury a real cheater under
#     thousands of rows from ordinary play.
#
# ccflag is registered by BridgePlugin and posts to /api/moderation/cheat-flag.

# %check_name% - name of the check
# %description% - description of the check
# %vl% - violations
# %verbose% - extra information
# %player% - player name
# [alert] - special command to alert
# [webhook] - special command to alert to discord webhook
# [proxy] - special command to alert to other servers connected to your proxy (BungeeCord/Velocity)

Punishments:
  Simulation:
    # After how many seconds should a violation be removed?
    remove-violations-after: 300
    # This section will match all checks with the name,
    # To exclude a check that would otherwise be matched, put an exclamation mark in front of the name
    # For example, !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Threshold:Interval Command
    #
    # N is the active violation count required to run the command.
    # Active violations are counted inside the remove-violations-after window.
    # M > 0 runs at N, then N+M, N+2M, ...
    # M = 0 runs once when N is reached.
    #
    # Examples:
    # - "100:0 kick %player% incorrect movement!"   fires once on flag 100
    # - "100:50 say %player% is cheating"           fires on flags 100, 150, 200, ...
    # - "5:3 [alert]"                               fires on flags 5, 8, 11, 14, ...
    #
    commands:
      - "100:40 [alert]"
      - "100:40 ccflag %player% %check_name% %vl% %description%"
      - "1:1 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "5:5 ccflag %player% %check_name% %vl% %description%"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "20:20 ccflag %player% %check_name% %vl% %description%"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "20:20 ccflag %player% %check_name% %vl% %description%"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 ccflag %player% %check_name% %vl% %description%"
      - "1:1 [log]"
      - "1:1 [webhook]"
      - "1:1 [proxy]"
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "5:3 ccflag %player% %check_name% %vl% %description%"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "10:5 [alert]"
      - "10:5 ccflag %player% %check_name% %vl% %description%"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 [alert]"
      - "20:40 ccflag %player% %check_name% %vl% %description%"
      - "1:1 [log]"
  # As of 2.2.10, there are no AutoClicker checks and this is a placeholder. Grim will include AutoClicker checks in the future.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "20:40 ccflag %player% %check_name% %vl% %description%"
      - "1:1 [log]"
