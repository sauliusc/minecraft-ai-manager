# Simple Voice Chat — server config, managed in git.
#
# Copied into the image (minecraft/Dockerfile: COPY minecraft/config/plugins/ /plugins/)
# and from there to /data/plugins/voicechat/ by itzg on every start, so edits made
# directly on the volume are overwritten — change this file instead.
#
# NOTE: `port` must stay in sync with the UDP mapping published for the minecraft
# service in deploymentV2/docker-compose.yml. Audio travels over UDP on this port;
# the handshake rides the Minecraft TCP connection, so a missing mapping looks like
# a working voice chat in the logs while no audio ever arrives. See #297.
port=24454

# Bind to all interfaces inside the container so Docker's port publishing works.
bind_address=

# Proximity settings — how far a normal voice and a whisper carry, in blocks.
max_voice_distance=48.0
whisper_distance=24.0

# Opus codec profile tuned for speech.
codec=VOIP
mtu_size=1024

# Keep-alive and rate limiting (plugin defaults).
tcp_rate_limit=16
keep_alive=1000

# Allow player-created group calls.
enable_groups=true

# Leave blank: clients derive the host from the address they joined with. Only set
# this if the voice chat must be reached on a different hostname or public port
# than the Minecraft server itself.
voice_host=

# Players may record audio locally; spectators cannot talk to living players.
allow_recording=true
spectator_interaction=false
spectator_player_possession=false

# Do not kick players who lack the client mod — voice chat stays optional.
force_voice_chat=false
login_timeout=10000

broadcast_range=-1.0
allow_pings=true
